# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prismago
      POSTGRES_PASSWORD: prismago
      POSTGRES_DB: prismago
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prismago -d prismago"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
